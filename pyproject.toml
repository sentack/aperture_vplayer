[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "aperture"
dynamic = ["version"]
description = "Cross-platform desktop video player"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
build = ["pyinstaller>=6.10"]

[project.gui-scripts]
aperture = "aperture.__main__:main"

[tool.hatch.version]
path = "src/aperture/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/aperture"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

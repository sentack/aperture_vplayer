<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aperture — reference UI</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
  :root{
    --accent:#3D7FFF;
  }
  :root[data-theme="dark"]{
    --bg-0:#111319; --bg-1:#1A1D27; --bg-2:#232733; --bg-3:#2E3342;
    --text-primary:#F5F5F7; --text-secondary:rgba(245,245,247,.64); --text-tertiary:rgba(245,245,247,.42);
    --bar-bg:rgba(24,25,31,.70); --bar-border:rgba(255,255,255,.09);
    --track-bg:rgba(255,255,255,.18); --divider:rgba(255,255,255,.12); --chip-bg:rgba(255,255,255,.07);
    --scrim-top:rgba(0,0,0,.40); --scrim-bottom:rgba(6,6,10,.55);
    --popover-bg:rgba(30,31,38,.94); --gear-hole:#181920;
    --bar-shadow:0 10px 36px rgba(0,0,0,.32); --knob-shadow:0 1px 4px rgba(0,0,0,.35);
    --idle-track:rgba(255,255,255,.14); --idle-label:rgba(245,245,247,.28);
  }
  :root[data-theme="light"]{
    --bg-0:#F2F2F0; --bg-1:#E7E7E3; --bg-2:#DADAD5; --bg-3:#CDCDC6;
    --text-primary:#17171A; --text-secondary:rgba(23,23,26,.64); --text-tertiary:rgba(23,23,26,.42);
    --bar-bg:rgba(255,255,255,.72); --bar-border:rgba(0,0,0,.07);
    --track-bg:rgba(0,0,0,.13); --divider:rgba(0,0,0,.10); --chip-bg:rgba(0,0,0,.045);
    --scrim-top:rgba(0,0,0,.08); --scrim-bottom:rgba(255,255,255,.55);
    --popover-bg:rgba(255,255,255,.96); --gear-hole:#FCFCFB;
    --bar-shadow:0 10px 32px rgba(20,20,24,.12); --knob-shadow:0 1px 4px rgba(0,0,0,.18);
    --idle-track:rgba(0,0,0,.12); --idle-label:rgba(23,23,26,.34);
  }

  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#0a0a0c;font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  button{background:none;border:none;padding:0;cursor:pointer;color:inherit;display:flex;align-items:center;justify-content:center;font:inherit}

  /* --- demo harness (not part of the player itself) --- */
  .harness{display:flex;flex-direction:column;align-items:center;gap:16px;padding:24px;min-height:100%}
  .controls-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center;color:#eee;font-size:13px}
  .controls-row .group{display:flex;align-items:center;gap:8px;background:#1b1b1f;border:1px solid #2c2c33;border-radius:12px;padding:6px 10px}
  .controls-row button.pill{padding:6px 12px;border-radius:999px;background:#26262c;color:#eee;font-size:12px}
  .controls-row button.pill[aria-pressed="true"]{background:#fff;color:#111}
  .controls-row input[type="color"]{width:28px;height:28px;border:none;border-radius:50%;padding:0;background:none}
  .controls-row input[type="color"]::-webkit-color-swatch-wrapper{padding:0}
  .controls-row input[type="color"]::-webkit-color-swatch{border:none;border-radius:50%}

  /* --- the player window itself --- */
  .window{position:relative;width:1440px;max-width:100%;aspect-ratio:1440/900;overflow:hidden;background:var(--bg-0);border-radius:14px}
  .art{position:absolute;inset:0;background:var(--bg-0)}
  .art .layer1{position:absolute;left:0;right:0;bottom:0;height:62%;background:var(--bg-1);clip-path:polygon(0% 48%,22% 28%,48% 42%,74% 18%,100% 36%,100% 100%,0% 100%)}
  .art .layer2{position:absolute;left:0;right:0;bottom:0;height:46%;background:var(--bg-2);clip-path:polygon(0% 62%,18% 36%,44% 54%,66% 22%,100% 48%,100% 100%,0% 100%)}
  .art .orb{position:absolute;top:14.2%;left:73.3%;width:9.2%;aspect-ratio:1;border-radius:50%;background:var(--bg-3);box-shadow:0 0 90px color-mix(in srgb, var(--bg-3) 55%, transparent)}
  .scrim-top{position:absolute;top:0;left:0;right:0;height:19%;background:linear-gradient(to bottom, var(--scrim-top), transparent);pointer-events:none}
  .scrim-bottom{position:absolute;left:0;right:0;bottom:0;height:33%;background:linear-gradient(to top, var(--scrim-bottom), transparent);pointer-events:none}

  .topbar{position:absolute;top:0;left:0;right:0;height:7.1%;display:flex;align-items:center;justify-content:space-between;padding:0 2.5%;transition:opacity .4s ease}
  .brand{display:flex;align-items:center;gap:12px}
  .logo{width:28px;height:28px;border-radius:9px;background:var(--accent);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .wordmark{font-size:13px;font-weight:700;letter-spacing:.14em;color:var(--text-primary);opacity:.92}
  .winctl{display:flex;align-items:center;gap:18px;color:var(--text-secondary)}

  .nowplaying{position:absolute;left:3.3%;bottom:16.7%;max-width:44%;transition:opacity .4s ease}
  .nowplaying .title{font-size:34px;font-weight:700;letter-spacing:-.02em;color:var(--text-primary)}
  .nowplaying .subtitle{margin-top:8px;font-size:14px;font-weight:500;color:var(--text-secondary)}

  .bar{position:absolute;left:2.2%;right:2.2%;bottom:3.6%;height:9.8%;border-radius:26px;background:var(--bar-bg);backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);border:1px solid var(--bar-border);box-shadow:var(--bar-shadow);display:flex;align-items:center;padding:0 26px;gap:20px;transition:opacity .4s ease, transform .4s ease}

  .play-btn{width:52px;height:52px;border-radius:50%;background:var(--accent);flex:0 0 auto;box-shadow:0 6px 18px color-mix(in srgb, var(--accent) 40%, transparent)}
  .time{font-size:13px;font-variant-numeric:tabular-nums;color:var(--text-secondary);flex:0 0 auto}
  .time.elapsed{min-width:40px}
  .time.remaining{min-width:48px;text-align:right}

  .seek{flex:1 1 auto;position:relative;height:14px;display:flex;align-items:center;cursor:pointer}
  .seek .track{position:absolute;left:0;right:0;height:6px;border-radius:3px;background:var(--track-bg)}
  .seek .fill{position:absolute;left:0;top:4px;height:6px;border-radius:3px;background:var(--accent);width:42%}
  .seek .knob{position:absolute;top:50%;left:42%;transform:translate(-50%,-50%);width:14px;height:14px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--bar-bg), var(--knob-shadow)}

  .divider{width:1px;height:26px;background:var(--divider);flex:0 0 auto}

  .volume-group{display:flex;align-items:center;gap:10px;flex:0 0 auto}
  .icon-btn{width:32px;height:32px;border-radius:10px;color:var(--text-secondary)}
  .volume-track{width:76px;height:4px;border-radius:2px;background:var(--track-bg);position:relative}
  .volume-fill{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:var(--accent);width:64%}

  .toggle-btn{width:40px;height:40px;border-radius:12px;color:var(--text-secondary)}

  .chip{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:16px;background:var(--chip-bg);flex:0 0 auto;position:relative}
  .settings-btn{width:28px;height:28px;color:var(--text-secondary)}
  .swatch-btn{width:26px;height:26px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--bar-bg), 0 0 0 3px var(--divider)}

  .popover{position:absolute;right:0;bottom:calc(100% + 14px);width:238px;border-radius:18px;background:var(--popover-bg);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--bar-border);box-shadow:0 16px 40px rgba(0,0,0,.35);padding:16px;display:none}
  .popover.open{display:block}
  .popover .label{font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--text-tertiary);text-transform:uppercase;margin-bottom:12px}
  .popover .row{display:flex;align-items:center;gap:12px}
  .popover .swatch{width:30px;height:30px;border-radius:50%;flex:0 0 auto}
  .popover .swatch[aria-pressed="true"]{box-shadow:0 0 0 2px var(--popover-bg), 0 0 0 4px var(--accent-swatch, currentColor)}
  .popover .tail{position:absolute;right:30px;bottom:-7px;width:14px;height:14px;background:var(--popover-bg);border-right:1px solid var(--bar-border);border-bottom:1px solid var(--bar-border);transform:rotate(45deg)}

  .idle-line{position:absolute;left:2.2%;right:2.2%;bottom:5.8%;height:3px;border-radius:2px;background:var(--idle-track);opacity:0;pointer-events:none;transition:opacity .4s ease}
  .idle-line .fill{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:var(--accent);width:42%;box-shadow:0 0 10px color-mix(in srgb, var(--accent) 60%, transparent)}
  .idle-label{position:absolute;left:0;right:0;bottom:1.8%;text-align:center;font-size:11px;letter-spacing:.08em;color:var(--idle-label);font-weight:500;opacity:0;transition:opacity .4s ease}

  .window[data-idle="true"] .topbar,
  .window[data-idle="true"] .nowplaying,
  .window[data-idle="true"] .bar{opacity:0;pointer-events:none}
  .window[data-idle="true"] .idle-line,
  .window[data-idle="true"] .idle-label{opacity:1}
</style>
</head>
<body>

<div class="harness">
  <div class="controls-row">
    <div class="group">
      <button class="pill" id="theme-dark" aria-pressed="true">Dark</button>
      <button class="pill" id="theme-light" aria-pressed="false">Light</button>
    </div>
    <div class="group">
      <input type="color" id="accent-custom" value="#3D7FFF" aria-label="Custom accent color">
      <button class="pill" data-accent="#3D7FFF">Blue</button>
      <button class="pill" data-accent="#FF6A52">Coral</button>
      <button class="pill" data-accent="#3FA671">Green</button>
    </div>
    <div class="group">
      <button class="pill" id="idle-toggle" aria-pressed="false">Simulate idle</button>
    </div>
  </div>

  <div class="window" id="window" data-theme="dark" data-idle="false">
    <div class="art">
      <div class="layer1"></div>
      <div class="layer2"></div>
      <div class="orb"></div>
    </div>
    <div class="scrim-top"></div>
    <div class="scrim-bottom"></div>

    <div class="topbar">
      <div class="brand">
        <div class="logo">
          <svg width="11" height="12" viewBox="0 0 11 12" fill="white" aria-hidden="true"><path d="M0 0.8c0-0.65.72-1.05 1.28-.7l9 5.2c.55.32.55 1.12 0 1.44l-9 5.2c-.56.35-1.28-.05-1.28-.7V0.8Z"/></svg>
        </div>
        <span class="wordmark">APERTURE</span>
      </div>
      <div class="winctl">
        <button aria-label="Minimize window"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><line x1="3" y1="8" x2="13" y2="8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button>
        <button aria-label="Maximize window"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><rect x="3.5" y="3.5" width="9" height="9" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></button>
        <button aria-label="Close window"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><line x1="3.5" y1="3.5" x2="12.5" y2="12.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><line x1="12.5" y1="3.5" x2="3.5" y2="12.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button>
      </div>
    </div>

    <div class="nowplaying">
      <div class="title">Nocturne</div>
      <div class="subtitle">Episode 3 · The Signal</div>
    </div>

    <div class="idle-line"><div class="fill"></div></div>
    <div class="idle-label">cursor idle — move to restore controls</div>

    <div class="bar">
      <button class="play-btn" id="play-btn" aria-label="Pause">
        <svg id="play-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.5" fill="white"/><rect x="14" y="5" width="4" height="14" rx="1.5" fill="white"/></svg>
      </button>

      <span class="time elapsed">14:22</span>

      <div class="seek" id="seek">
        <div class="track"></div>
        <div class="fill"></div>
        <div class="knob"></div>
      </div>

      <span class="time remaining">-32:10</span>

      <div class="divider"></div>

      <div class="volume-group">
        <button class="icon-btn" aria-label="Mute">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4Z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/><path d="M19 6a9 9 0 0 1 0 12" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg>
        </button>
        <div class="volume-track"><div class="volume-fill"></div></div>
      </div>

      <div class="divider"></div>

      <button class="toggle-btn" aria-label="Toggle playlist">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="5" cy="7" r="1.4" fill="currentColor"/><circle cx="5" cy="12" r="1.4" fill="currentColor"/><circle cx="5" cy="17" r="1.4" fill="currentColor"/><path d="M9.5 7H20M9.5 12H20M9.5 17H20" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg>
      </button>

      <button class="toggle-btn" aria-label="Toggle fullscreen">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 4H5a1 1 0 0 0-1 1v4M15 4h4a1 1 0 0 1 1 1v4M9 20H5a1 1 0 0 1-1-1v-4M15 20h4a1 1 0 0 0 1-1v-4" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>

      <div class="chip">
        <button class="settings-btn" aria-label="Playback settings">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/><circle cx="14" cy="7" r="2.3" fill="var(--gear-hole)" stroke="currentColor" stroke-width="1.75"/><circle cx="8" cy="17" r="2.3" fill="var(--gear-hole)" stroke="currentColor" stroke-width="1.75"/></svg>
        </button>
        <button class="swatch-btn" id="swatch-btn" aria-label="Choose accent color" aria-expanded="false"></button>

        <div class="popover" id="popover">
          <div class="label">Accent color</div>
          <div class="row" id="popover-row">
            <button class="swatch" data-accent="#3D7FFF" style="background:#3D7FFF" aria-label="Vivid blue"></button>
            <button class="swatch" data-accent="#FF6A52" style="background:#FF6A52" aria-label="Warm coral"></button>
            <button class="swatch" data-accent="#3FA671" style="background:#3FA671" aria-label="Muted green"></button>
            <button class="swatch" data-accent="#E8A23D" style="background:#E8A23D" aria-label="Amber"></button>
            <button class="swatch" data-accent="#8B6FE8" style="background:#8B6FE8" aria-label="Violet"></button>
          </div>
          <div class="tail"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  const win = document.getElementById('window');
  const root = document.documentElement;

  function setTheme(theme){
    win.dataset.theme = theme;
    document.getElementById('theme-dark').setAttribute('aria-pressed', theme === 'dark');
    document.getElementById('theme-light').setAttribute('aria-pressed', theme === 'light');
  }
  document.getElementById('theme-dark').addEventListener('click', () => setTheme('dark'));
  document.getElementById('theme-light').addEventListener('click', () => setTheme('light'));

  function setAccent(hex){
    root.style.setProperty('--accent', hex);
    document.getElementById('accent-custom').value = hex;
    document.querySelectorAll('.popover .swatch').forEach(s => {
      s.setAttribute('aria-pressed', s.dataset.accent.toLowerCase() === hex.toLowerCase());
    });
  }
  document.querySelectorAll('[data-accent]').forEach(el => {
    el.addEventListener('click', () => setAccent(el.dataset.accent));
  });
  document.getElementById('accent-custom').addEventListener('input', e => setAccent(e.target.value));
  setAccent('#3D7FFF');

  const playBtn = document.getElementById('play-btn');
  const playIcon = document.getElementById('play-icon');
  let playing = true;
  playBtn.addEventListener('click', () => {
    playing = !playing;
    playBtn.setAttribute('aria-label', playing ? 'Pause' : 'Play');
    playIcon.innerHTML = playing
      ? '<rect x="6" y="5" width="4" height="14" rx="1.5" fill="white"/><rect x="14" y="5" width="4" height="14" rx="1.5" fill="white"/>'
      : '<path d="M7 5.3c0-1 1.1-1.6 1.95-1.05l9.5 6.2c.8.5.8 1.7 0 2.2l-9.5 6.2C8.1 19.3 7 18.7 7 17.7V5.3Z" fill="white"/>';
  });

  const swatchBtn = document.getElementById('swatch-btn');
  const popover = document.getElementById('popover');
  swatchBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    const open = popover.classList.toggle('open');
    swatchBtn.setAttribute('aria-expanded', open);
  });
  document.addEventListener('click', () => {
    popover.classList.remove('open');
    swatchBtn.setAttribute('aria-expanded', 'false');
  });

  const seek = document.getElementById('seek');
  seek.addEventListener('click', (e) => {
    const rect = seek.getBoundingClientRect();
    const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
    seek.querySelector('.fill').style.width = (pct * 100) + '%';
    seek.querySelector('.knob').style.left = (pct * 100) + '%';
  });

  const idleToggle = document.getElementById('idle-toggle');
  idleToggle.addEventListener('click', () => {
    const idle = win.dataset.idle !== 'true';
    win.dataset.idle = idle;
    idleToggle.setAttribute('aria-pressed', idle);
    idleToggle.textContent = idle ? 'Restore controls' : 'Simulate idle';
  });
</script>
</body>
</html>

name: Release

# Push a tag matching the package version (v0.6.0 for __version__ = "0.6.0") to publish.
# Manual runs build the same artifacts without publishing a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml
    secrets: inherit

  publish:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # In-app updates refuse any download that does not match this list.
      - name: Checksums
        run: cd dist && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          # Notes for each version live in RELEASE_NOTES.md; edit it before tagging.
          body_path: RELEASE_NOTES.md

name: CI

# Only for main: pushes to it and pull requests into it. Work-in-progress branches run
# nothing until they are proposed for main, which keeps Actions minutes for what ships.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-15]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libglib2.0-0 libdbus-1-3 libpulse0 \
            ffmpeg  # encodes the sample clips for tests/test_codecs.py

      - run: pip install -e ".[dev]"

      - name: Tests, including the offscreen QML smoke test
        run: pytest
        env:
          QT_QPA_PLATFORM: offscreen

      # --- Temporary: find what crashes Qt on macOS in the audio-boost path. ----------------
      # `shell: bash {0}` (no -e) so one crashing case does not stop the rest.
      - name: "Diagnose: boost crash probe (macOS)"
        if: always() && runner.os == 'macOS'
        shell: bash {0}
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          for case in raw-plain raw-detach-audio raw-buffer raw-both raw-both-player-first \
                      raw-both-capture-first controller-plain controller-boost; do
            python -X faulthandler .github/scripts/probe_boost_crash.py "$case"
            echo "::notice title=probe $case::exit $?"
          done

      - name: "Diagnose: the crashing UI test alone (macOS)"
        if: always() && runner.os == 'macOS'
        shell: bash {0}
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -X faulthandler -m pytest -q -p no:cacheprovider \
            "tests/test_ui_smoke.py::test_phase_10_commands_without_media"
          echo "::notice title=test_phase_10_commands_without_media alone::exit $?"

      - name: "Diagnose: macOS crash reports"
        if: always() && runner.os == 'macOS'
        run: |
          sleep 15  # ReportCrash writes a report a few seconds after the process dies
          python .github/scripts/print_crash_reports.py

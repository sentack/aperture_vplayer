name: CI

# Only for main: pushes to it and pull requests into it. Work-in-progress branches run
# nothing until they are proposed for main, which keeps Actions minutes for what ships.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-15]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libglib2.0-0 libdbus-1-3 libpulse0 \
            ffmpeg  # encodes the sample clips for tests/test_codecs.py

      - run: pip install -e ".[dev]"

      - name: Tests, including the offscreen QML smoke test
        run: pytest
        env:
          QT_QPA_PLATFORM: offscreen

  # Package every pull request exactly like a release, so a broken installer, AppImage or
  # disk image fails the PR. The built files can be downloaded from the run for testing.
  package:
    if: github.event_name == 'pull_request'
    needs: test
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      run_tests: false
      retention_days: 7
